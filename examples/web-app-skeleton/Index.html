<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- the viewport must live in the .html — rules/htmlservice-frontend.md Rule #1 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Record App</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: .5rem; margin: .25rem 0; width: 100%; box-sizing: border-box; }
    .error { color: #c00; }
    .hidden { display: none; }
    li { margin: .25rem 0; }
  </style>
</head>
<body>
  <h1>Record App <small id="version"></small></h1>

  <!-- Login -->
  <div id="loginView">
    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Log in</button>
    <p id="loginError" class="error"></p>
  </div>

  <!-- App -->
  <div id="appView" class="hidden">
    <p>Hello <b id="displayName"></b></p>
    <input id="title" placeholder="Record title">
    <input id="phone" placeholder="Phone number (e.g. 0812345678)">
    <button onclick="doSave()">Save</button>
    <p id="saveMsg"></p>
    <ul id="recordList"></ul>
  </div>

  <script>
    let sessionToken = null;

    // one wrapper for every RPC — client-side log boundary (rules/logging-boundaries.md)
    function rpc(fnName, ...args) {
      console.log('[rpc→]', fnName, args);
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(res => {
            console.log('[rpc←]', fnName, res);
            if (res && res.ok === false) reject(new Error(res.message || 'Something went wrong'));
            else resolve(res);
          })
          .withFailureHandler(err => {
            console.error('[rpc✗]', fnName, err);
            reject(new Error('Connection failed, please try again'));
          })[fnName](...args);
      });
    }

    async function doLogin() {
      document.getElementById('loginError').textContent = '';
      try {
        const res = await rpc('login',
          document.getElementById('username').value.trim(),
          document.getElementById('password').value);
        sessionToken = res.token;
        document.getElementById('displayName').textContent = res.displayName;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        loadRecords();
      } catch (err) {
        document.getElementById('loginError').textContent = err.message;
      }
    }

    async function doSave() {
      const msg = document.getElementById('saveMsg');
      msg.textContent = 'Saving...';
      try {
        const res = await rpc('saveRecord', sessionToken, {
          title: document.getElementById('title').value,
          phone: document.getElementById('phone').value,
        });
        msg.textContent = res.message;
        document.getElementById('title').value = '';
        document.getElementById('phone').value = '';
        loadRecords();
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'error';
      }
    }

    async function loadRecords() {
      try {
        const res = await rpc('listRecords', sessionToken);
        const ul = document.getElementById('recordList');
        ul.innerHTML = '';
        res.data.forEach(r => {
          const li = document.createElement('li');
          // CreatedAt is an ISO string — format it client-side for the locale
          li.textContent = r.Title + ' — ' + new Date(r.CreatedAt).toLocaleString('en-US');
          ul.appendChild(li); // textContent is XSS-safe — never use innerHTML with user data
        });
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
